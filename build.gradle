plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fitback'
version = '0.0.1-SNAPSHOT'
description = 'FITBACK-Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.47.3')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'software.amazon.awssdk:cloudfront'
	implementation 'software.amazon.awssdk:bedrockruntime'
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// OAuth
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Cache
	implementation 'com.github.ben-manes.caffeine:caffeine'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('aiTagBlindEvaluation', JavaExec) {
	group = 'verification'
	description = 'Runs the opt-in OpenAI/Bedrock blind image evaluation.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.fitback.backend.external.aitag.AiTagBlindEvaluationMain'
}

tasks.register('openAiTagEvaluation', JavaExec) {
	group = 'verification'
	description = 'Runs the opt-in OpenAI canonical tag baseline evaluation.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.fitback.backend.external.aitag.OpenAiTagEvaluationMain'
}

tasks.register('openAiTagEvaluationGate', JavaExec) {
	group = 'verification'
	description = 'Runs the offline OpenAI canonical tag evaluation acceptance gate.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.fitback.backend.external.aitag.OpenAiTagEvaluationGateMain'
}
